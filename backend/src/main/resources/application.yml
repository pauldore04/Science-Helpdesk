spring:
  application:
    name: science-helpdesk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/science_helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
